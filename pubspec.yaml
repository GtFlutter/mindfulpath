name: meditation_app
description: A new Flutter Meditation App project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.5 <4.0.0"
  flutter: "3.10.5"

dependencies:
  country_code_picker: ^3.0.0
  dropdown_button2: ^2.3.9
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6 # [State Management]
  flutter_svg: ^2.0.7
  go_router: ^10.0.0 # [Navigation]
  http: ^1.1.0
  intl: ^0.18.1
  pinput: ^2.2.31
  shared_preferences: ^2.2.0
  syncfusion_flutter_charts: ^22.1.39
  video_player: ^2.7.0
  flutter_html: ^3.0.0-beta.2
  share_plus: ^7.1.0
  json_annotation: ^4.8.1
  syncfusion_flutter_pdfviewer: ^22.2.12
  path_provider: ^2.1.2
  path: ^1.8.3
  dio: ^5.4.0
  permission_handler: ^11.1.0
  sqflite: ^2.3.0
  sqflite_migration: ^0.3.0
  http_auth: ^1.0.4
  webview_flutter: ^4.4.4
  webview_flutter_android: ^3.13.2
  webview_flutter_wkwebview: ^3.11.0

  #notifications:
  flutter_local_notifications: ^16.3.0

  firebase_messaging: ^14.7.21
  firebase_core: ^2.27.2

  #google sign in
  google_sign_in: ^6.2.1
  firebase_auth: ^4.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  riverpod_lint: ^2.3.7
  custom_lint: ^0.5.7

  flutter_launcher_icons: ^0.13.1



flutter_launcher_icons:
  image_path: "assets/image/splash_screen_logo.png"
  #image_path_android: "assets/image/splash_sceen_logo.png"
  #image_path_ios: "assets/image/splash_sceen_logo.png"
  android: true
  ios: true
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/icons/svg/
  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/mulish/Mulish-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/mulish/Mulish-ExtraLightItalic.ttf
          weight: 200
          style: italic

        - asset: assets/fonts/mulish/Mulish-Light.ttf
          weight: 300
        - asset: assets/fonts/mulish/Mulish-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/mulish/Mulish-Regular.ttf
          weight: 400
        - asset: assets/fonts/mulish/Mulish-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/mulish/Mulish-Medium.ttf
          weight: 500
        - asset: assets/fonts/mulish/Mulish-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/mulish/Mulish-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/mulish/Mulish-SemiBoldItalic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/mulish/Mulish-Bold.ttf
          weight: 700
        - asset: assets/fonts/mulish/Mulish-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/mulish/Mulish-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/mulish/Mulish-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        - asset: assets/fonts/mulish/Mulish-Black.ttf
          weight: 900
        - asset: assets/fonts/mulish/Mulish-BlackItalic.ttf
          weight: 900
          style: italic

    - family: Brandon Grotesque Medium
      fonts:
        - asset: assets/fonts/brandon/BrandonGrotesque-Medium.otf
          weight: 500

    - family: Brandon Grotesque
      fonts:
        - asset: assets/fonts/brandon/BrandonGrotesque-Bold.otf
          weight: 700
